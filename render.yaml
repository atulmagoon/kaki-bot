# Render Blueprint: one always-on web service in Singapore.
services:
  - type: web
    name: kaki-bot
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MODEL
        value: claude-haiku-5-5
      - key: DEFAULT_MODE
        value: hawker
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      # Secrets: Render asks you to paste these during setup. They are never stored in GitHub.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
